# Center data for the ULC Los Gatos membership agreement. Each entry fills the
# listed template placeholders. A value of null leaves the placeholder in the
# generated file so nobody mistakes a guess for a fact. Status is committed for
# a fact somebody has fixed, assumed for a value we plan around until someone
# commits, and open for a value nobody has decided. Member fields, the Kite
# merge fields, the contract dates and the signature blocks are not listed here
# because Kite fills them at signing.
output_name: ULC Los Gatos Membership Agreement.docx

fields:
  - keys: [CENTERNAME, STUDIONAME]
    value: MSC Sustain LLC
    status: committed
    basis: The operating entity for the center, named on the 10/6 Kite merchant application

  - keys: [LOCATION]
    value: ULC Los Gatos
    status: committed
    basis: The DBA on the Kite merchant application and the center name used across the vault

  - keys: [CENTERADDRESS, STUDIOADDRESS]
    value: 14235 Walker St, Suite 10, Los Gatos, CA 95032
    status: assumed
    basis: The Junction address from Site Selection and the 10/9 ULC facility line. The lease is not signed, so confirm the suite and zip when it is. Section G sends rescission notices here, so presale also needs a mailing address that works before the center exists

  - keys: [CENTEREMAIL, STUDIOEMAIL]
    value: samit.chaudhuri+losgatos@ultimatelongevitycenters.com
    status: open
    basis: The address on the Kite merchant application. Michelle has not answered whether the center gets a role-based address such as losgatos@ultimatelongevitycenters.com

  - keys: [CENTERPHONE, STUDIOPHONE]
    value: null
    status: open
    basis: Kite has a placeholder phone and no center number exists yet

  - keys: [STUDIOURL]
    value: null
    status: open
    basis: The center page on ultimatelongevitycenter.com, not yet known

  - keys: [URLTOEMAILLINK]
    value: null
    status: open
    basis: Section H (e) links a pre-formatted cancellation email, which Kite or the center has to provide
