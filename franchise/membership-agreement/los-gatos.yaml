# Center data for the ULC Los Gatos membership agreement. The facts live in
# the Site 1 identity section of ULC Franchise Project.md, so change them there
# first. Each entry fills the
# listed template placeholders. A value of null leaves the placeholder in the
# generated file so nobody mistakes a guess for a fact. Status is committed for
# a fact somebody has fixed, assumed for a value we plan around until someone
# commits, and open for a value nobody has decided. Member fields, the Kite
# merge fields, the contract dates and the signature blocks are not listed here
# because Kite fills them at signing.
output_name: ULC Los Gatos Membership Agreement.docx

fields:
  - keys: [CENTERNAME, STUDIONAME]
    value: MSC Sustain LLC
    status: committed
    basis: The operating entity for the center, named on the 10/6 Kite merchant application

  - keys: [LOCATION]
    value: ULC Los Gatos
    status: committed
    basis: The DBA on the Kite merchant application and the center name used across the vault

  - keys: [CENTERADDRESS, STUDIOADDRESS]
    value: 14235 Walker St, Suite 10, Los Gatos, CA 95032
    status: committed
    basis: Confirmed by Samit on 10/16. Section G sends rescission notices here, so presale also needs a mailing address that works before the center exists

  - keys: [CENTEREMAIL, STUDIOEMAIL]
    value: losgatos@ultimatelongevitycenters.com
    status: committed
    basis: Elise gave us this role-based center address, and it has already been given to Kite. It replaces the plus address on the 10/6 merchant application

  - keys: [CENTERPHONE, STUDIOPHONE]
    value: 408-380-2126
    status: committed
    basis: Given by Samit on 10/16

  - keys: [STUDIOURL]
    value: https://www.ultimatelongevitycenter.com/locations/los-gatos?hsLang=en
    status: committed
    basis: The Los Gatos location page, given by Samit on 10/16

  - keys: [URLTOEMAILLINK]
    value: mailto:losgatos@ultimatelongevitycenters.com?subject=Cancel%20my%20membership
    status: committed
    basis: Samit on 10/16 asked for a pre-formatted cancellation email to the center email. Section H (e) reads "found at" this value, so it is a mailto link with the subject filled in
