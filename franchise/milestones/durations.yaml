# Milestones are dated events, and each holds a range of dates. A rule runs from a
# source milestone, `from`, to a target milestone, `to`, with a duration of
# `duration_days` [lo, hi]. A positive duration puts the target after the source and a negative one, such as
# -21 for three weeks before, puts it before. A rule narrows the target and never the source. The terms are
# explained in the vault's `ULC Milestone Timeline Runbook.md`, and the mechanics are in README.md. Keys are the
# stable names that goals and targets link to in the vault; never rename one without updating those links.
# gantt_row is the row in `ULC Los Gatos Opening Timeline.xlsx`, blank where the
# template has no bar. A milestone with no bar of its own shares the row of the milestone it follows, and the CSV export lists it right after that row. `span_from` names a milestone where the row's bar starts, so the
# Gantt row runs from that milestone to this one, such as GM sourcing to the accepted offer.
#
# Each rule has `from`, `to`, `duration_days` and a `kind`. An estimate is a
# forecast of how long something takes, such as Fibr's 45 days. A requirement is
# a duration somebody needs to hold, such as the lease signed within 60 days of the permits. A
# preference is a duration somebody wants and would give up, such as Michelle Tomko's GM in
# seat 3 weeks before launch. The generator dates from a preference like a requirement, but
# a miss is an "ideal missed by N days" warning and not a collision. A
# duration with no maximum is written with a trailing comma, such as [10,], and one with no minimum is
# written with a leading comma, such as [,-14] for at least 14 days before. A rule with no maximum is a not-before
# rule: it sets the earliest date and no latest date. A milestone with not-before rules starts as soon as the
# latest of them allows, so its latest date is the latest of their latest dates, but only when no other rule
# or site date gives the milestone a latest date.
#
# Each milestone is an input, fixable or computed. `input: true` means the site must give
# the date in sites.yaml. Any other milestone is computed from the rules, and a
# date in sites.yaml for it is ignored unless the row has `fixable: true`.
# Then the date the site gives replaces the estimates that compute it, while
# the other rules on it still apply.
#
# A milestone's range is the intersection of every rule that points at it. When
# the rules cannot all hold, the generator flags the collision and names the rules. It sets one rule
# aside to draw the dates: a preference if the collision has one, else a requirement, else the estimate
# listed last. A not-before rule is never set aside.
#
# A phase is a rule with a table row of its own, a key and a basis, and the
# generator also flags any phase whose actual span falls outside its range.
phases:
  - key: permit-review
    label: City permit review
    start: permits-submitted
    end: permits-received
    duration_days: [46, 56]
    kind: estimate
    basis: Vision Track plans 46 days from 12/14 to 1/29, and Jason Park quoted about 8 weeks, 56 days, for the initial review in San Diego, Boston and Miami, which are the national worst cases; the regulatory assessment file due 10/23 gives the Los Gatos estimate

  - key: presale-setup
    label: Presale set up
    start: presale-kickoff
    end: vip-start
    duration_days: [14, 17]
    kind: estimate
    basis: The 10/9 kickoff deck gives about 2 weeks, and Elise Budowanec's follow-up the same day launches campaigns 10/26, 17 days after the call

  - key: presale-vip-booking
    label: VIP interest list and pre-booking
    start: vip-start
    end: presale-launch
    duration_days: [42, 56]
    kind: estimate
    basis: Michelle Tomko said on 10/14 that VIP booking runs 6 to 8 weeks, which widens the deck's about 6 weeks, and the 10/9 call set 12/14 for launch, 49 days after a 10/26 start

  - key: presale-membership-sales
    label: Founding membership sales
    start: presale-launch
    end: soft-open
    duration_days: [120, 180]
    kind: estimate
    basis: Michelle Tomko said on 10/14 that membership sales run 4 to 6 months, which replaces the deck and the playbook's 3 to 5 months. Soft open mostly comes from the build chain, so this phase bounds it from launch and flags a build that falls outside the window

constraints:
  - {from: presale-kickoff, to: digital-partner-selected, duration_days: [0, 17], kind: requirement}
  - {from: vip-start, to: digital-partner-selected, duration_days: [-17, 0], kind: requirement}
  - {from: presale-kickoff, to: presale-kit-ordered, duration_days: [0,], kind: requirement}
  - {from: gm-in-seat, to: presale-kit-ordered, duration_days: [,-14], kind: requirement}
  - {from: presale-launch, to: presale-kit-ordered, duration_days: [,-14], kind: requirement}
  - {from: presale-kickoff, to: membership-agreement-finalized, duration_days: [0, 17], kind: requirement}
  - {from: vip-start, to: membership-agreement-finalized, duration_days: [-17, 0], kind: requirement}
  - {from: gm-sourcing, to: gm-offer-accepted, duration_days: [45, 45], kind: estimate}
  - {from: gm-offer-accepted, to: gm-in-seat, duration_days: [14, 28], kind: estimate}
  - {from: presale-launch, to: gm-in-seat, duration_days: [-21, -21], kind: preference}
  - {from: lease-signed, to: permits-submitted, duration_days: [0, 60], kind: requirement}
  - {from: landlord-delivery, to: construction-start, duration_days: [0,], kind: requirement}
  - {from: permits-received, to: construction-start, duration_days: [10,], kind: estimate}
  - {from: landlord-delivery, to: rent-commences, duration_days: [150,], kind: requirement}
  - {from: permits-received, to: rent-commences, duration_days: [150,], kind: requirement}
  - {from: construction-start, to: lighting-flooring-delivered, duration_days: [42, 42], kind: estimate}
  - {from: construction-start, to: equipment-installed, duration_days: [91, 91], kind: estimate}
  - {from: equipment-installed, to: av-ordered, duration_days: [-84, -84], kind: estimate}
  - {from: soft-open, to: equipment-ordered, duration_days: [-60, -45], kind: estimate}
  - {from: construction-start, to: millwork-lighting-ordered, duration_days: [0, 0], kind: estimate}
  - {from: construction-start, to: build-complete, duration_days: [84, 98], kind: estimate}
  - {from: construction-start, to: soft-open, duration_days: [91, 105], kind: estimate}
  - {from: soft-open, to: grand-opening, duration_days: [42, 56], kind: estimate}

milestones:
  - key: presale-kickoff
    label: Presale kickoff call
    gantt_row: 34
    input: true
    basis: Elise Budowanec offered three slots on 10/5 and Samit accepted Friday 10/9 at 11:30 AM PT with Don Michael, Michelle Tomko and Elise

  - key: digital-partner-selected
    label: Digital partner selected
    gantt_row: 37
    fixable: true
    basis: Elise Budowanec's 10/9 follow-up asks Samit to pick one of three approved local agencies, PRSPR, 5th Element or JL Marketing, by 10/23 to launch campaigns on 10/26. It has to land between the kickoff and the VIP start

  - key: presale-kit-ordered
    label: Presale marketing kit ordered
    gantt_row: 37
    fixable: true
    basis: The 10/9 kickoff deck lists the kit as a Sales & Operations next step. We control the order and not the delivery. Elise said on the 10/21 call that the lead time is 2 weeks, that the kit is needed for grassroots events and that it can arrive early and wait in the garage. Samit wants the order at least 2 weeks before the GM is in seat or any grassroots event. The order no longer has to come before the VIP start, because the kit is not needed for it. The model backs the date out from the GM in seat and from presale launch with two requirements of at least 14 days, so the window runs from the kickoff to the latest date both allow. The grassroots events have no milestone, so they are not checked

  - key: membership-agreement-finalized
    label: Membership agreement finalized
    gantt_row: 19
    fixable: true
    basis: The membership agreement is final once ULC approves the attorney redline of the California template, so it can be loaded into Kite. Presale cannot sell memberships without it, and it has to land between the kickoff and the VIP start. The 0 to 17 day range from the kickoff is a placeholder from the review-only version of this milestone and still needs a duration that fits the redline and ULC approval

  - key: lease-signed
    label: Lease signed
    gantt_row: 24
    input: true
    basis: The draft from Anson Switzer is due 10/15, and lender and franchisor approvals run in parallel

  - key: gm-sourcing
    label: GM sourcing begins
    gantt_row:
    input: true
    basis: Fibr, the recruiter ULC sponsors, starts the search, and the site supplies the date

  - key: gm-offer-accepted
    label: GM offer accepted
    gantt_row: 32
    span_from: gm-sourcing
    basis: Regan Hahn at Fibr quoted 45 days from the start of the search to an accepted offer on the 10/7 call, which Samit confirmed, and Michelle's checkpoint for an accepted offer is 10/31

  - key: gm-in-seat
    label: GM in seat
    gantt_row: 32
    basis: Two to four weeks of notice between the accepted offer and the start date, and Michelle Tomko prefers the GM in seat 3 weeks before presale launch, which is an ideal and not a hard requirement. Launch comes from the VIP start, so this date is the hiring target backed out from launch. Corporate reviews the GM's goals weekly

  - key: construction-documents-complete
    label: Construction documents complete
    gantt_row: 22
    input: true
    basis: Vision Track shows construction documents from 11/26 to 12/4 in the 10/14 walkthrough with Jason Park, and the architect starts from the space plan and site survey report due 10/23

  - key: bid-complete
    label: GC bids received
    gantt_row: 23
    input: true
    basis: Vision Track shows the bid from 12/8 to 12/22, and Jason Park wants three to five GC bids within about two weeks so resubmissions fit before permits

  - key: permits-submitted
    label: Permits submitted
    gantt_row: 26
    fixable: true
    basis: The Counter LOI gives 60 days after the lease to submit

  - key: permits-received
    label: Permits issued
    gantt_row: 26
    fixable: true
    basis: Permits submitted plus the city review phase

  - key: landlord-delivery
    label: Landlord delivers the suite
    gantt_row: 26
    input: true
    basis: Greg supplied April 2027 availability on 8/27, not yet a committed date, so the site records the date it plans around

  - key: construction-start
    label: Buildout starts
    gantt_row: 27
    basis: Starts on the later of landlord delivery and the gap after permits are issued that Vision Track leaves between 1/29 and 2/8

  - key: rent-commences
    label: Rent commences
    gantt_row:
    basis: The Counter LOI starts rent a fixed span after the later of permit receipt and delivery

  - key: lighting-flooring-delivered
    label: Lighting and flooring delivered
    gantt_row: 28
    basis: Template puts it six weeks into the build, week of 12/30 against a 11/18 start

  - key: equipment-installed
    label: Equipment install starts
    gantt_row: 29
    basis: Template starts install 13 weeks into the build and finishes it the week of 2/24, to confirm with Jason Park and Kaleb Ballard. The A/V package must arrive by this date, and the millwork and lighting system is ordered separately

  - key: equipment-ordered
    label: Equipment ordered and invoice paid
    gantt_row: 25
    basis: Don Michael said on 10/14 that the equipment invoice, $478K, is paid 45 to 60 days before soft open. Samit's position is that the invoice is paid before the order is placed, so one date stands for both, and the funding ramp draws from it. Invoice 1029 has no A/V line and no millwork, so it covers equipment and shipping only. The template's row 25 orders earlier, before construction starts, because it follows the A/V lead time, which this table carries as A/V ordered

  - key: av-ordered
    label: A/V ordered
    gantt_row: 25
    basis: The franchisor template gives the A/V package a 12-week lead time, 84 days, before install. No vendor has confirmed it, so it stays an estimate until Jason Park and Kaleb Ballard do, and it is open whether the 84 days run from this order or from payment

  - key: millwork-lighting-ordered
    label: Millwork and lighting system ordered and paid
    gantt_row: 25
    basis: The FDD's Item 7 row 6 prices the millwork and lighting system at $65,000 to $100,000 as a separate franchisor purchase paid in cash as incurred, and the equipment invoice does not include it. Jason Park said on 10/14 that millwork, flooring, lights and A/V are paid around the time construction starts, so the order is placed at construction start. The lead time to install is not confirmed. Flooring is a GC item under net leasehold improvements, so it has no order of its own here

  - key: build-complete
    label: Certificate of occupancy issued
    gantt_row: 30
    basis: Jason Park quoted 12 to 14 weeks of construction on the 10/14 call, 84 to 98 days, which replaces the franchisor template's 15 weeks. We read his range as construction start to certificate of occupancy

  - key: soft-open
    label: Soft open
    gantt_row: 49
    basis: One week after the certificate of occupancy, the template's gap between its 15 and 16 weeks of build

  - key: vip-start
    label: Pre-booking starts, VIP list opens
    gantt_row: 38
    fixable: true
    basis: Presale kickoff plus the set up phase

  - key: presale-launch
    label: Membership sales start, presale launch
    gantt_row: 43
    fixable: true
    basis: VIP start plus the pre-booking phase

  - key: grand-opening
    label: Grand opening
    gantt_row:
    basis: Follows soft open by the duration of the rule from soft open to grand opening
