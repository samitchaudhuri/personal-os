# Milestones are dated events. Every duration between two of them is a rule "to
# minus from is within [lo, hi] days", and the range can be negative, such as -21
# for three weeks before. Keys are the stable names that goals and targets link to
# in the vault; never rename one without updating those links.
# gantt_row is the row in `ULC Los Gatos Opening Timeline.xlsx`, blank where the
# template has no bar. `span_from` names a milestone where the row's bar starts, so the
# Gantt row runs from that milestone to this one, such as GM sourcing to the accepted offer.
#
# Each rule has `from`, `to`, `duration_days` [lo, hi] and a `kind`. An estimate is a
# forecast of how long something takes, such as Fibr's 45 days. A requirement is
# a duration somebody needs to hold, such as the lease signed within 60 days of the permits. A
# preference is a duration somebody wants and would give up, such as Michelle Tomko's GM in
# seat 3 weeks before launch. The generator dates from a preference like a requirement, but
# a miss is an "ideal missed by N days" warning and not a collision. A
# `duration_days` pair with hi null, such as [10, null], is a not-before rule: it sets the
# earliest date and no latest date. A milestone with not-before rules starts as
# soon as the latest of them allows, so its latest date is the latest of their
# latest dates.
#
# Each milestone is an input or computed. `input: true` means the site must give
# the date in sites.yaml. Any other milestone is computed from the rules, and a
# date in sites.yaml for it is ignored unless the row has `site_can_fix: true`.
# Then the date the site gives replaces the estimates that compute it, while
# requirements on it still apply.
#
# A milestone's range is the intersection of every rule that reaches it, and the
# rules narrow both ends. When the rules cannot all hold, the generator flags the
# collision and names the rules. It sets one rule aside to draw the dates: a
# preference if the collision has one, else a requirement, else the estimate listed last, so put the
# checks last. A not-before rule is never set aside.
#
# A phase is a rule with a table row of its own, a key and a basis, and the
# generator also flags any phase whose actual span falls outside its range.
phases:
  - key: permit-review
    label: City permit review
    start: permits-submitted
    end: permits-received
    duration_days: [46, 56]
    kind: estimate
    basis: Vision Track plans 46 days from 12/14 to 1/29, and Jason Park quoted about 8 weeks, 56 days, for the initial review in San Diego, Boston and Miami, which are the national worst cases; the regulatory assessment file due 10/23 gives the Los Gatos estimate

  - key: presale-setup
    label: Presale set up
    start: presale-kickoff
    end: vip-start
    duration_days: [14, 17]
    kind: estimate
    basis: The 10/9 kickoff deck gives about 2 weeks, and Elise Budowanec's follow-up the same day launches campaigns 10/26, 17 days after the call

  - key: presale-vip-booking
    label: VIP interest list and pre-booking
    start: vip-start
    end: presale-launch
    duration_days: [42, 56]
    kind: estimate
    basis: Michelle Tomko said on 10/14 that VIP booking runs 6 to 8 weeks, which widens the deck's about 6 weeks, and the 10/9 call set 12/14 for launch, 49 days after a 10/26 start

  - key: presale-membership-sales
    label: Founding membership sales
    start: presale-launch
    end: soft-open
    duration_days: [120, 180]
    kind: estimate
    basis: Michelle Tomko said on 10/14 that membership sales run 4 to 6 months, which replaces the deck and the playbook's 3 to 5 months. Soft open mostly comes from the build chain, so this phase bounds it from launch and flags a build that falls outside the window

constraints:
  - {from: gm-sourcing, to: gm-offer-accepted, duration_days: [45, 45], kind: estimate}
  - {from: gm-offer-accepted, to: gm-in-seat, duration_days: [14, 28], kind: estimate}
  - {from: gm-in-seat, to: presale-launch, duration_days: [21, 21], kind: preference}
  - {from: lease-signed, to: permits-submitted, duration_days: [0, 60], kind: requirement}
  - {from: landlord-delivery, to: construction-start, duration_days: [0, null], kind: requirement}
  - {from: permits-received, to: construction-start, duration_days: [10, null], kind: estimate}
  - {from: landlord-delivery, to: rent-commences, duration_days: [150, null], kind: requirement}
  - {from: permits-received, to: rent-commences, duration_days: [150, null], kind: requirement}
  - {from: construction-start, to: lighting-flooring, duration_days: [42, 42], kind: estimate}
  - {from: construction-start, to: equipment-delivered, duration_days: [91, 91], kind: estimate}
  - {from: av-ordered, to: equipment-delivered, duration_days: [84, 84], kind: estimate}
  - {from: equipment-paid, to: soft-open, duration_days: [45, 60], kind: estimate}
  - {from: equipment-paid, to: equipment-ordered, duration_days: [0, null], kind: requirement}
  - {from: construction-start, to: build-complete, duration_days: [105, 105], kind: estimate}
  - {from: construction-start, to: soft-open, duration_days: [112, 112], kind: estimate}
  - {from: soft-open, to: grand-opening, duration_days: [42, 56], kind: estimate}

milestones:
  - key: presale-kickoff
    label: Presale kickoff call
    gantt_row: 34
    input: true
    basis: Elise Budowanec offered three slots on 10/5 and Samit accepted Friday 10/9 at 11:30 AM PT with Don Michael, Michelle Tomko and Elise

  - key: lease-signed
    label: Lease signed
    gantt_row: 24
    input: true
    basis: The draft from Anson Switzer is due 10/15, and lender and franchisor approvals run in parallel

  - key: gm-sourcing
    label: GM sourcing begins
    gantt_row:
    input: true
    basis: Fibr, the recruiter ULC sponsors, starts the search, and the site supplies the date

  - key: gm-offer-accepted
    label: GM offer accepted
    gantt_row: 32
    span_from: gm-sourcing
    basis: Regan Hahn at Fibr quoted 45 days from the start of the search to an accepted offer on the 10/7 call, which Samit confirmed, and Michelle's checkpoint for an accepted offer is 10/31

  - key: gm-in-seat
    label: GM in seat
    gantt_row: 32
    basis: Two to four weeks of notice between the accepted offer and the start date, and Michelle Tomko prefers the GM in seat 3 weeks before presale launch, which is an ideal and not a hard requirement. Corporate reviews the GM's goals weekly

  - key: construction-documents-complete
    label: Construction documents complete
    gantt_row: 22
    input: true
    basis: Vision Track shows construction documents from 11/26 to 12/4 in the 10/14 walkthrough with Jason Park, and the architect starts from the space plan and site survey report due 10/23

  - key: bid-complete
    label: GC bids received
    gantt_row: 23
    input: true
    basis: Vision Track shows the bid from 12/8 to 12/22, and Jason Park wants three to five GC bids within about two weeks so resubmissions fit before permits

  - key: permits-submitted
    label: Permits submitted
    gantt_row: 26
    site_can_fix: true
    basis: The Counter LOI gives 60 days after the lease to submit

  - key: permits-received
    label: Permits issued
    gantt_row:
    site_can_fix: true
    basis: Permits submitted plus the city review phase of 46 to 56 days

  - key: landlord-delivery
    label: Landlord delivers the suite
    gantt_row:
    input: true
    basis: Greg supplied April 2027 availability on 8/27, not yet a committed date, so the site records the date it plans around

  - key: construction-start
    label: Buildout starts
    gantt_row: 27
    basis: Starts on the later of landlord delivery and 10 days after permits are issued, the gap Vision Track leaves between 1/29 and 2/8

  - key: rent-commences
    label: Rent commences
    gantt_row:
    basis: The Counter LOI starts rent 150 days after the later of permit receipt and delivery

  - key: lighting-flooring
    label: Lighting and flooring delivered
    gantt_row: 28
    basis: Template puts it six weeks into the build, week of 12/30 against a 11/18 start

  - key: equipment-delivered
    label: Equipment and millwork install starts
    gantt_row: 29
    basis: Template starts install 13 weeks into the build and finishes it the week of 2/24, to confirm with MMP. The A/V package must arrive by this date, and millwork has no lead time of its own yet

  - key: av-ordered
    label: A/V ordered
    gantt_row:
    basis: The franchisor template gives the A/V package a 12-week lead time, 84 days, before install. No vendor has confirmed it, so it stays an estimate until MMP does, and it is open whether the 84 days run from this order or from payment

  - key: equipment-paid
    label: Equipment invoice paid
    gantt_row:
    basis: Don Michael said on 10/14 that the equipment invoice, $478K, is paid 45 to 60 days before soft open. Samit's position is that the invoice is paid before the equipment order is placed, and it is open whether the invoice includes A/V and millwork or equipment alone

  - key: equipment-ordered
    label: Equipment ordered
    gantt_row: 25
    basis: Placed once the invoice is paid, so it falls in the same 45 to 60 days before soft open. ULC gives MMP the date, and MMP starts the draw from it. The template's row 25 orders earlier, before construction starts, because it follows the A/V lead time, which this table now carries as A/V ordered

  - key: build-complete
    label: Certificate of occupancy issued
    gantt_row: 30
    basis: Template issues it 15 weeks after construction starts, week of 3/3 against a 11/18 start

  - key: soft-open
    label: Soft open
    gantt_row: 49
    basis: Template opens 16 weeks after construction starts, 3/10 against 11/18, which matches the Junction model's July 2027

  - key: vip-start
    label: Pre-booking starts, VIP list opens
    gantt_row: 38
    site_can_fix: true
    basis: Presale kickoff plus the set up phase of 14 to 17 days

  - key: presale-launch
    label: Membership sales start, presale launch
    gantt_row: 43
    site_can_fix: true
    basis: VIP start plus the pre-booking phase of 42 to 56 days

  - key: grand-opening
    label: Grand opening
    gantt_row:
    basis: Six to eight weeks after soft open
