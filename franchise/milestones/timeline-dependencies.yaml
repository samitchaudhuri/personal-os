  39: {after: [32], why: Hiring and training follow recruiting}
  40: {after: [34], why: Weekly calls begin after the kickoff}
  41: {after: [24], why: Signage needs a lease and a site plan}
  42: {after: [34], why: Grassroots planning follows the kickoff}
