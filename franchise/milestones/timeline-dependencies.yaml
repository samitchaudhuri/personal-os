# Proposed finish-to-start dependencies between rows of the opening timeline
# workbook, keyed by Gantt row. These are proposals for the CSV export, not
# franchisor rules. `after` lists predecessor rows, and `why` gives the reason
# in a few words. A row with no entry has no predecessor.
dependencies:
  8:  {after: [7],  why: Morrow Hill is engaged after the franchise agreement is signed}
  9:  {after: [7],  why: Training follows the signing}
  10: {after: [7],  why: The entity is formed after signing}
  11: {after: [10], why: The EIN needs the entity}
  12: {after: [11], why: The bank account needs the EIN}
  13: {after: [10], why: The DBA registers the entity's trade name}
  14: {after: [11], why: Licenses need the entity and EIN}
  15: {after: [7],  why: The model review follows the signing}
  16: {after: [8, 15], why: The LOI needs Morrow Hill engaged and the model reviewed}
  17: {after: [12], why: Financing needs the bank account}
  18: {after: [10], why: The insurer needs the entity}
  21: {after: [16], why: The lease is negotiated after the LOI}
  22: {after: [16], why: The architect is hired after the LOI}
  23: {after: [22], why: GC bids need the construction documents}
  24: {after: [21], why: Signing follows negotiation}
  25: {after: [24], why: Equipment is ordered after the lease}
  26: {after: [24, 22], why: Permits are submitted after the lease and the construction documents}
